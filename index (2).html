<script>
(()=>{
const $=s=>document.querySelector(s),c=$('#game'),g=c.getContext('2d'),W=960,H=540,ov=$('#overlay'),keys={},FS=1/60,
U={level:$('#level'),coins:$('#coins'),ammo:$('#ammo'),lives:$('#lives')},
TH=[['КӨКТЕМГІ ОРМАН','#75dafa','#d1f4dc','#94d9ac','#865338','#39b85e'],['ҚҰМДЫ ШӨЛ','#ffb66b','#ffe6a5','#e7b866','#9a6341','#eaa13e'],['МҰЗДЫ ТАУЛАР','#8bd8ff','#e6f8ff','#a8d7eb','#687d9a','#54c8df'],['ТҮНГІ ҚАЛА','#222d67','#6959a9','#454881','#49405e','#9271ed'],['ЖАНАРТАУ АРАЛЫ','#ff8868','#ffd18c','#bc6653','#604247','#fa854c'],['ҒАРЫШ ӘЛЕМІ','#192957','#5276b8','#354b83','#444875','#53c7c8']];
let level=1,score=0,ammo=0,lives=3,cam=0,frame=0,running=false,paused=false,muted=false,shake=0,hero='explorer',best=1,world=2300,theme=TH[0],plats=[],coins=[],picks=[],foes=[],shots=[],spikes=[],parts=[],texts=[],boss=null,banner=0,lastShot=-99,lastPunch=-99,lastKick=-99,fx=0,fxKind='punch',jumpDown=false,buf=0,energy=100,lock=0,seed=1,mode='menu',raf=0,last=0,acc=0,AC;
try{best=+localStorage.getItem('d20k')||1}catch(e){}
const p={x:55,y:428,w:30,h:42,vx:0,vy:0,ground:false,inv:0,face:1,sx:55,sy:470,jumps:0,coy:0,anim:0,on:null,guard:false};
const R=()=>(seed=seed*16807%2147483647,(seed-1)/2147483646);
function snd(f,d=.1,t='square',v=.05,s=0){if(muted)return;try{AC=AC||new AudioContext();const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);if(s)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+s),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(e){}}
function burst(x,y,col,n=10,sp=4){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,l:26+Math.random()*16,c:col,s:2+Math.random()*3})}}
function say(x,y,s,col='#fff'){texts.push({x,y,s,c:col,l:44})}
function sync(){U.coins.textContent=score;U.ammo.textContent=ammo;U.lives.textContent=lives;U.level.textContent=level}
function makeLevel(){
 const L=level;theme=TH[(L-1)%6];seed=L*9973+11;world=2300+Math.min(L,60)*16;
 plats=[{x:0,y:470,w:390,h:70,x0:0,amp:0}];spikes=[];coins=[];picks=[];foes=[];shots=[];parts=[];texts=[];boss=null;
 let x=450,py=420;
 while(x<world-520){
  const w=Math.max(100,Math.round(135+R()*70-L*.5)),y=Math.max(300,Math.min(440,py+(R()-.5)*110));py=y;
  const q={x,y,w,h:22,x0:x,amp:0,sp:0};
  if(L>=8&&R()<.28){q.amp=20+R()*12;q.sp=.02+R()*.015;q.moving=1;q.x0=x+q.amp}
  plats.push(q);
  if(!q.moving){
   if(w>=130&&L>=4&&R()<.25+L*.004)spikes.push({x:x+w/2-20,y:y-14,w:40,h:14});
   else if(R()<.75)for(let i=1;i<4;i++)coins.push({x:x+w*i/4,y:y-34});
   if(R()<.3)plats.push({x:x+25,y:y-78,w:70,h:16,x0:x+25,amp:0,sp:0})
  }
  x+=w+q.amp+55+R()*(25+Math.min(L,70)*.7)
 }
 plats.push({x:Math.min(x,world-480),y:430,w:120,h:22,x0:0,amp:0},{x:world-340,y:455,w:340,h:85,x0:0,amp:0});
 const st=plats.filter(q=>!q.moving&&q.w>=100&&q.x>420&&q.x<world-400),na=Math.min(6,2+(L/15|0));
 for(let i=0;i<na&&st.length;i++){const q=st[Math.floor((i+.5)*st.length/na)];picks.push({x:q.x+q.w/2,y:q.y-30,t:'a'})}
 if(L%4===0&&st.length){const q=st[st.length>>1];picks.push({x:q.x+q.w/2+30,y:q.y-30,t:'h'})}
 const n=Math.min(10,2+(L/5|0)),hp=1+(L/25|0),sp=Math.min(2.4,.7+L*.02),fl=st.filter(q=>q.w>=120&&!spikes.some(s=>s.x>q.x&&s.x<q.x+q.w));
 for(let i=0;i<n&&fl.length;i++){const q=fl[Math.floor((i+.5)*fl.length/n)%fl.length],fly=L>=6&&i%3===2;
  foes.push({x:q.x+20+R()*20,y:fly?q.y-110:q.y-32,by:q.y-110,w:30,h:32,a:fly?q.x-70:q.x+4,b:fly?q.x+q.w+40:q.x+q.w-34,hp,mh:hp,v:sp*(i%2?-1:1),alive:true,fly,flash:0,stun:0})}
 if(L%10===0){const bh=10+(L/2|0);boss={x:world-250,y:391,by:391,w:56,h:64,a:world-335,b:world-166,hp:bh,mh:bh,v:1.5,alive:true,boss:1,flash:0,stun:0};foes.push(boss)}
 Object.assign(p,{x:55,y:428,vx:0,vy:0,ground:false,inv:45,sx:55,sy:470,jumps:0,coy:0,on:null});jumpDown=false;buf=0;energy=100;cam=0;banner=170;sync()}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function dmg(e,n){e.hp-=n;e.flash=6;if(e.hp<=0){e.alive=false;const v=e.boss?25:3;score+=v;sync();burst(e.x+e.w/2,e.y+e.h/2,e.boss?'#ffd54a':'#b56fe0',e.boss?40:16,5);say(e.x,e.y-8,'+'+v,'#ffe06b');snd(220,.2,'square',.06,300);if(e.boss)shake=26}else snd(180,.07,'square',.05)}
function fire(){if(ammo<=0||frame-lastShot<14)return;ammo--;lastShot=frame;shots.push({x:p.face>0?p.x+p.w:p.x-12,y:p.y+19,v:p.face*9,life:100});sync();snd(520,.1,'sawtooth',.035,-320)}
function melee(k){const kick=k==='kick';if(frame-(kick?lastKick:lastPunch)<(kick?34:22))return;if(kick)lastKick=frame;else lastPunch=frame;fx=kick?15:10;fxKind=k;snd(kick?130:200,.09,'triangle',.06,-60);
 const range=kick?64:48,ex=p.face>0?p.x+p.w:p.x;
 const t=foes.filter(e=>{if(!e.alive||Math.abs(e.y+e.h/2-(p.y+22))>e.h/2+26)return false;const d=p.face>0?e.x-ex:ex-(e.x+e.w);return d<range&&d>-e.w-p.w}).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x))[0];
 if(t){dmg(t,kick?2:1);t.stun=kick?20:10;t.x+=p.face*(kick?14:8);shake=Math.max(shake,5)}}
function hurt(fall){
 if(!fall){if(p.inv)return;if(p.guard){energy=Math.max(0,energy-14);p.inv=12;snd(240,.08,'square',.05);burst(p.x+15+p.face*24,p.y+20,'#81d8ff',6);return}}
 lives--;sync();shake=14;burst(p.x+15,p.y+20,'#ff5a5f',16,5);snd(150,.3,'sawtooth',.07,-90);
 if(lives<=0){finish(false);return}
 if(fall){p.x=p.sx;p.y=p.sy-p.h;p.vx=0;p.vy=0;cam=Math.max(0,p.x-W*.35)}else{p.vy=-7;p.vx=-p.face*5}
 p.inv=100}
function nextLevel(){
 snd(660,.12,'triangle',.06,0);setTimeout(()=>snd(880,.12,'triangle',.06,0),110);setTimeout(()=>snd(1180,.2,'triangle',.06,0),220);
 if(level>=100){finish(true);return}
 level++;if(level>best){best=level;try{localStorage.setItem('d20k',best)}catch(e){}}
 const bonus=level%5===0&&lives<5;if(bonus)lives++;makeLevel();if(bonus)say(p.x,p.y-20,'+1 ❤️','#ff8aa0')}
function update(){
 frame++;
 for(const q of plats)if(q.amp){const nx=q.x0+Math.sin(frame*q.sp)*q.amp;q.dx=nx-q.x;q.x=nx}
 const left=keys.ArrowLeft||keys.KeyA,right=keys.ArrowRight||keys.KeyD,J=keys.Space||keys.ArrowUp||keys.KeyW,jp=J&&!jumpDown;jumpDown=J;
 p.guard=!!(keys.KeyL||keys.KeyV)&&energy>0&&lock<=0;
 if(p.guard){energy-=1.1;if(energy<=0){energy=0;lock=60}}else{energy=Math.min(100,energy+.45);lock--}
 const tv=left?-3.7:right?3.7:0;if(left)p.face=-1;if(right)p.face=1;
 const ac=p.ground?.6:.34;p.vx+=Math.max(-ac,Math.min(ac,tv-p.vx));
 if(jp)buf=7;else if(buf>0)buf--;
 if(buf>0){if(p.ground||p.coy>0){p.vy=-13.4;p.jumps=1;p.ground=false;p.coy=0;buf=0;snd(300,.15,'square',.04,300);burst(p.x+15,p.y+p.h,'#ffffffaa',5,2)}else if(p.jumps<2){p.vy=-12;p.jumps=2;buf=0;snd(420,.15,'square',.04,300);burst(p.x+15,p.y+p.h,'#fff6a8',8,3)}}
 if(!J&&p.vy<-4)p.vy+=.9;
 if(p.coy>0)p.coy--;
 if(keys.KeyI||keys.KeyX)fire();if(keys.KeyJ||keys.KeyZ)melee('punch');if(keys.KeyK||keys.KeyC)melee('kick');
 if(p.on)p.x+=p.on.dx||0;
 const lim=boss&&boss.alive?world-110-p.w:world-p.w;p.x=Math.max(0,Math.min(lim,p.x+p.vx));
 const old=p.y,was=p.ground;p.vy=Math.min(14,p.vy+.62);p.y+=p.vy;p.ground=false;p.on=null;
 for(const q of plats)if(p.vy>=0&&old+p.h<=q.y+4&&p.y+p.h>=q.y&&p.x+p.w>q.x+3&&p.x<q.x+q.w-3){if(!was&&p.vy>6){burst(p.x+15,q.y,'#ffffff99',6,2.5);shake=Math.max(shake,3)}p.y=q.y-p.h;p.vy=0;p.ground=true;p.on=q;p.jumps=0;p.coy=7;if(!q.moving){p.sx=Math.max(q.x+4,Math.min(q.x+q.w-p.w-4,p.x));p.sy=q.y}}
 if(p.ground&&Math.abs(p.vx)>.5)p.anim+=.32;if(p.y>H+80)hurt(true);if(p.inv>0)p.inv--;
 for(const s of spikes)if(!p.inv&&hit({x:p.x+4,y:p.y+4,w:p.w-8,h:p.h-4},s))hurt(true);
 for(const a of coins)if(!a.taken&&Math.hypot(p.x+15-a.x,p.y+20-a.y)<28){a.taken=1;score++;sync();snd(880,.09,'triangle',.06,500);burst(a.x,a.y,'#ffd84a',6,2.5)}
 for(const a of picks)if(!a.taken&&Math.hypot(p.x+15-a.x,p.y+20-a.y)<34){a.taken=1;if(a.t==='h'){if(lives<5)lives++;say(a.x,a.y,'+1 ❤️','#ff8aa0')}else{const n=12+(level/10|0)*2;ammo+=n;say(a.x,a.y,'+'+n+' 🔫')}sync();snd(600,.15,'triangle',.06,400);burst(a.x,a.y,'#ffffff',8,3)}
 for(const s of shots){s.x+=s.v;s.life--;for(const e of foes)if(e.alive&&hit({x:s.x,y:s.y,w:12,h:7},e)){dmg(e,1);s.life=0;break}}shots=shots.filter(s=>s.life>0);
 for(const e of foes)if(e.alive){
  if(e.flash>0)e.flash--;if(e.stun>0){e.stun--;continue}
  e.x+=e.v;if(e.x<e.a||e.x>e.b){e.v*=-1;e.x=Math.max(e.a,Math.min(e.b,e.x))}if(e.fly)e.y=e.by+Math.sin(frame*.06+e.a)*28;
  if(hit(p,e)){if(p.vy>1&&old+p.h<e.y+e.h*.55){dmg(e,1);p.vy=-9;p.jumps=1;p.inv=Math.max(p.inv,8)}else hurt(false)}}
 for(const t of parts){t.x+=t.vx;t.y+=t.vy;t.vy+=.18;t.l--}parts=parts.filter(t=>t.l>0);
 for(const t of texts){t.y-=.7;t.l--}texts=texts.filter(t=>t.l>0);

 cam+=(Math.max(0,Math.min(world-W,p.x-W*.35+p.face*50))-cam)*.12;

function rr(x,y,w,h,r,col){g.fillStyle=col;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function drawHero(){
 if(p.inv&&Math.floor(frame/5)%2===0&&!p.guard)return;
 const S={explorer:['#ed6249','#ffd2a3','#3c78dd','#ffe16c'],ninja:['#252a48','#f4c7a1','#272d4c','#d44d76'],robot:['#46b7b3','#bde9e8','#536d8e','#ffe16c'],wizard:['#7952bd','#f4d0af','#382d75','#7ef0dc'],astronaut:['#e6edf5','#f4d3b6','#4267ad','#f1a84b']}[hero];
 const sy=p.ground?1+Math.sin(p.anim*2)*.02:1+Math.min(.16,Math.abs(p.vy)*.013);
 g.save();g.translate(p.x+15,p.y+p.h);g.scale(p.face*(2-sy),sy);
 g.fillStyle='#17253d44';g.beginPath();g.ellipse(0,1,17,4,0,0,7);g.fill();
 const a=p.ground?Math.sin(p.anim)*5:3;g.fillStyle='#39405d';g.fillRect(-11+a,-5,9,5);g.fillRect(3-a,-5,9,5);
 rr(-12,-30,24,28,8,S[0]);rr(-10,-40,21,17,hero==='robot'?4:8,S[1]);rr(-14,-42,27,9,5,S[2]);
 g.fillStyle='#fff';g.fillRect(4,-34,5,6);g.fillStyle=hero==='robot'?'#31e7ff':'#26334d';g.fillRect(7,-32,3,4);g.fillStyle=S[3];g.fillRect(-6,-21,6,7);
 if(hero==='ninja'){g.fillStyle='#d44d76';g.fillRect(-12,-35,25,4);g.fillRect(-18,-33,7,3)}
 if(hero==='wizard'){g.fillStyle=S[2];g.beginPath();g.moveTo(-13,-39);g.lineTo(0,-58);g.lineTo(13,-39);g.fill()}
 if(hero==='robot'){g.fillStyle='#bde9e8';g.fillRect(-2,-47,3,6);g.fillRect(-4,-49,7,3)}
 if(hero==='astronaut'){g.strokeStyle='#b9e8ff';g.lineWidth=3;g.beginPath();g.arc(0,-32,13,Math.PI,0);g.stroke()}
 if(ammo>0){g.fillStyle='#434a5c';g.fillRect(9,-18,18,5);g.fillStyle='#f8d24f';g.fillRect(24,-17,4,3)}
 g.restore();
 if(p.guard){g.fillStyle='#81d8ff88';g.beginPath();g.arc(p.x+15+p.face*22,p.y+20,22,0,7);g.fill();g.strokeStyle='#d8f3ff';g.lineWidth=2;g.stroke()}}
function drawFoe(e){

function begin(from){hero=$('#hero').value;level=from;score=0;ammo=0;lives=3;makeLevel();ov.style.display='none';running=true;paused=false;acc=0;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);snd(500,.1,'triangle',.05,300)}
function loop(t){if(!running)return;acc+=Math.min(.1,(t-last)/1000);last=t;if(!paused)while(acc>=FS){update();acc-=FS;if(!running)break}else acc=0;draw();raf=requestAnimationFrame(loop)}
